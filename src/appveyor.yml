image: Visual Studio 2022
environment:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
services:
  - postgresql13
build_script:
- cmd: >-
    SET PGUSER=postgres

    set pgpassword=Password12!

    PATH=C:\Program Files\PostgreSQL\13\bin\;%PATH%

    psql.exe -h localhost -U postgres -c "ALTER SYSTEM SET track_commit_timestamp to 'on'"

    createdb delta

    net stop postgresql-x64-13

    net start postgresql-x64-13
- pwsh: |
    Invoke-WebRequest "https://dot.net/v1/dotnet-install.ps1" -OutFile "./dotnet-install.ps1"
    ./dotnet-install.ps1 -JSonFile global.json -Architecture x64 -InstallDir 'C:\Program Files\dotnet'
- dotnet build src --configuration Release
- dotnet test --solution src/Elforyn.slnx --configuration Release --no-build --no-restore --results-directory TestResults --report-trx
test: off
on_finish:
- pwsh: |
    $url = "https://ci.appveyor.com/api/testresults/mstest/$env:APPVEYOR_JOB_ID"
    $client = [System.Net.WebClient]::new()
    foreach ($trx in Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue)
    {
      Write-Host "Uploading $($trx.FullName)"
      $client.UploadFile($url, $trx.FullName)
    }
artifacts:
- path: nugets\*.nupkg